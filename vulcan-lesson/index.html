<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulcan Complete Lesson</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: a slate "screen" player (animated SVG + quiz panels) over a light page. Part 2 of the Vulcan series. */
:root {
  --bg: #F3F2EF;
  --surface: #FFFFFF;
  --ink: #242422;
  --muted: #5E625F;
  --line: #D8D3CD;
  --accent: #00807F;
  --hl: rgba(84, 222, 209, .22);

  /* The player keeps one slate-and-teal look in both themes */
  --stage-bg: #1C292F;
  --stage-panel: #243740;
  --stage-line: #3B525A;
  --stage-ink: #E7EFED;
  --stage-dim: #8BA5A8;
  --stage-teal: #54DED1;
  --stage-teal-soft: rgba(84, 222, 209, .13);
  --stage-ember: #FF6B4F;
  --stage-ember-soft: rgba(255, 107, 79, .14);
  --stage-on-teal: #0E1E22;
  --stage-night: #0b1013;
  --stage-tank: #1f4a4a;

  --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111618; --surface: #192124; --ink: #E8E6E2; --muted: #9AA4A3; --line: #2B3639;
    --accent: #54DED1; --hl: rgba(84, 222, 209, .14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111618; --surface: #192124; --ink: #E8E6E2; --muted: #9AA4A3; --line: #2B3639;
  --accent: #54DED1; --hl: rgba(84, 222, 209, .14); color-scheme: dark;
}

:root[data-stage="light"] {
  --stage-bg: #F6F4F0; --stage-panel: #FFFFFF; --stage-line: #CFC9C1; --stage-ink: #1F2A2E; --stage-dim: #5A6B6D;
  --stage-teal: #00807F; --stage-teal-soft: rgba(0, 128, 127, .10); --stage-ember: #C4442D; --stage-ember-soft: rgba(196, 68, 45, .10);
  --stage-on-teal: #FFFFFF; --stage-night: #7C9296; --stage-tank: #DCEFEC;
}
:root[data-stage="light"] .player { box-shadow: 0 0 0 1px var(--stage-line); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 28px; }

header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

/* Player */
.player { container-type: inline-size; background: var(--stage-bg); color: var(--stage-ink); border-radius: 14px; overflow: hidden; }
.screen { position: relative; aspect-ratio: 16 / 9; }
.screen.is-panel { aspect-ratio: auto; min-height: 56.25cqi; display: flex; }
.stage { display: block; width: 100%; height: 100%; }

.stage text { fill: var(--stage-ink); font-family: var(--font-body); font-size: 16px; }
.stage .lbl { font-size: 15px; fill: var(--stage-dim); }
.stage .sm { font-size: 13.5px; }
.stage .dim { fill: var(--stage-dim); }
.stage .mono { font-family: var(--font-mono); font-size: 13.5px; }
.stage .code { font-family: var(--font-mono); font-size: 13px; white-space: pre; }
.stage .ttl { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.stage .big { font-family: var(--font-display); font-weight: 700; font-size: 36px; }
.stage .xl2 { font-family: var(--font-display); font-weight: 700; font-size: 50px; }
.stage .xl { font-family: var(--font-display); font-weight: 700; font-size: 60px; }
.stage .warn { fill: var(--stage-ember); }
.stage .tealt { fill: var(--stage-teal); }
.stage .ontealt { fill: var(--stage-on-teal); font-weight: 600; }
.stage .eyb { font-family: var(--font-mono); font-size: 14px; letter-spacing: .22em; fill: var(--stage-teal); }

.stage .ln { fill: none; stroke: var(--stage-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.stage .ln.t { stroke: var(--stage-teal); }
.stage .box { fill: var(--stage-panel); stroke: var(--stage-line); stroke-width: 1.4; }
.stage .layer { fill: var(--stage-teal-soft); stroke: var(--stage-teal); stroke-width: 1.6; }
.stage .tealfill { fill: var(--stage-teal); }
.stage .cyl path, .stage .cyl ellipse { fill: var(--stage-panel); stroke: var(--stage-dim); stroke-width: 1.4; }
.stage .arr { stroke: var(--stage-dim); stroke-width: 1.6; fill: none; }
.stage .arr.t { stroke: var(--stage-teal); }
.stage .arr.e { stroke: var(--stage-ember); }
.stage .dash { stroke-dasharray: 6 6; }
.stage .ahp { fill: var(--stage-dim); }
.stage .ahp.t { fill: var(--stage-teal); }
.stage .ahp.e { fill: var(--stage-ember); }
.stage .chip { fill: none; stroke-width: 1.3; }
.stage .chip.e { stroke: var(--stage-ember); }
.stage .chip.t { stroke: var(--stage-teal); }
.stage .chip.d { stroke: var(--stage-dim); }
.stage .bar { fill: var(--stage-line); }
.stage .cell { fill: var(--stage-teal); opacity: .45; }
.stage .colhl { fill: var(--stage-teal-soft); stroke: var(--stage-teal); stroke-width: 1.6; }
.stage .rowbad { fill: var(--stage-ember-soft); stroke: var(--stage-ember); stroke-width: 1.4; }
.stage .codehl { fill: var(--stage-teal-soft); }
.stage .rule { stroke: var(--stage-line); stroke-width: 1; }

.stage [data-s] { opacity: 0; transform: translateY(10px); transition: opacity .55s ease, transform .55s ease; }
.stage [data-s].on { opacity: 1; transform: none; }

.start {
  position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--stage-teal); color: var(--stage-on-teal); border: 0; border-radius: 999px;
  padding: 12px 22px 12px 18px; font: 600 16px var(--font-body); cursor: pointer;
}
.start svg { width: 18px; height: 18px; }

/* Panels (questions, explain-back, results) */
.panel { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: clamp(20px, 4cqi, 44px); }
.panel h3 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 3.1cqi, 28px); line-height: 1.2; margin: 0; text-wrap: balance; outline: none; }
.panel .tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--stage-teal); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.opt {
  text-align: left; background: var(--stage-panel); color: var(--stage-ink);
  border: 1.5px solid var(--stage-line); border-radius: 10px; padding: 12px 14px;
  font: 500 15.5px/1.35 var(--font-body); cursor: pointer;
}
.opt code, .panel code { font-family: var(--font-mono); font-size: .92em; }
.opt:hover:not(:disabled) { border-color: var(--stage-teal); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--stage-teal); background: var(--stage-teal-soft); }
.opt.wrong { border-color: var(--stage-ember); opacity: .75; }
.opt.picked { border-color: var(--stage-dim); }
.opt.sm { padding: 6px 12px; font-size: 14px; }
.opt.sel { border-color: var(--stage-teal); background: var(--stage-teal-soft); }
.cls { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; }
.crow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; background: var(--stage-panel); border: 1.5px solid transparent; border-radius: 10px; padding: 8px 10px 8px 14px; font-size: 15px; }
.crow.good { border-color: var(--stage-teal); }
.crow.bad { border-color: var(--stage-ember); }
.crow .pair { display: flex; gap: 6px; }
.fb { display: grid; gap: 4px; background: var(--stage-panel); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.fb b { font-weight: 600; }
.fb.ok b { color: var(--stage-teal); }
.fb.no b { color: var(--stage-ember); }
.fb.neutral b { color: var(--stage-dim); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { background: var(--stage-teal); color: var(--stage-on-teal); border: 0; border-radius: 8px; padding: 10px 16px; font: 600 15px var(--font-body); cursor: pointer; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--stage-ink); border: 1px solid var(--stage-line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--stage-teal); }
.slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.slot { display: inline-flex; align-items: center; gap: 8px; border: 1.5px dashed var(--stage-line); border-radius: 8px; padding: 8px 12px; font-size: 15px; color: var(--stage-dim); min-width: 110px; }
.slot.filled { border-style: solid; color: var(--stage-ink); }
.slot span { font-family: var(--font-mono); font-size: 12px; color: var(--stage-teal); }
textarea {
  width: 100%; box-sizing: border-box; min-height: 92px; resize: vertical;
  background: var(--stage-panel); color: var(--stage-ink); border: 1.5px solid var(--stage-line); border-radius: 10px;
  padding: 12px 14px; font: 15.5px/1.5 var(--font-body);
}
textarea:focus { border-color: var(--stage-teal); outline: none; }
.model { background: var(--stage-teal-soft); border: 1px solid var(--stage-teal); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 7cqi, 56px); line-height: 1; color: var(--stage-teal); }
.rlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rlist li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--stage-panel); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.rlist .q { flex: 1 1 220px; min-width: 0; }
.pill { font-family: var(--font-mono); font-size: 12px; border-radius: 999px; padding: 3px 10px; border: 1px solid; }
.pill.ok { color: var(--stage-teal); border-color: var(--stage-teal); }
.pill.no { color: var(--stage-ember); border-color: var(--stage-ember); }
.linkbtn { background: none; border: 0; color: var(--stage-ink); text-decoration: underline; text-underline-offset: 3px; font: 500 14px var(--font-body); cursor: pointer; padding: 0; }
.panel p { margin: 0; color: var(--stage-dim); font-size: 15px; }

/* Captions + controls */
.caption { min-height: 3.1em; padding: 12px clamp(14px, 2.4cqi, 24px); font-size: clamp(15px, 2.1cqi, 19px); line-height: 1.45; border-top: 1px solid var(--stage-line); }
.caption.off { display: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 14px; border-top: 1px solid var(--stage-line); }
.chapters { flex: 1 1 100%; order: -1; display: flex; align-items: center; gap: 2px; height: 22px; min-width: 0; }
.seg { position: relative; height: 8px; flex-basis: 0; min-width: 18px; margin-left: 6px; background: var(--stage-line); border: 0; padding: 0; border-radius: 3px; overflow: hidden; cursor: pointer; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--stage-teal); transition: width .4s ease; }
.seg:hover { background: var(--stage-dim); }
.seg:first-child { margin-left: 0; }
.qmark { flex: none; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: var(--stage-line); border: 0; padding: 0; cursor: pointer; }
.qmark:hover { background: var(--stage-dim); }
.qmark.done { background: var(--stage-teal); }
.qmark.now { background: var(--stage-teal); outline: 2px solid var(--stage-teal); outline-offset: 2px; }
.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: transparent; color: var(--stage-ink); border: 1px solid var(--stage-line); border-radius: 8px;
  padding: 6px 10px; font: 500 13px var(--font-body); cursor: pointer; min-height: 34px;
}
.ctl:hover:not(:disabled) { border-color: var(--stage-teal); }
.ctl:disabled { opacity: .4; cursor: default; }
.ctl[aria-pressed="false"] { color: var(--stage-dim); text-decoration: line-through; }
.ctl svg { width: 16px; height: 16px; }
#playBtn { width: 40px; padding: 0; }
select.ctl { appearance: none; padding-right: 10px; }
.player :focus-visible, .wrap :focus-visible { outline: 2px solid var(--stage-teal); outline-offset: 2px; }

@media (max-width: 520px) { .stage text { font-size: 18px; } }
.stage .il { fill: none; stroke: var(--stage-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.stage .il.t { stroke: var(--stage-teal); }
.stage .il.e { stroke: var(--stage-ember); }
.stage .il.d { stroke: var(--stage-dim); }
.stage .il.thick { stroke-width: 6; }
.stage .il.thickish { stroke-width: 3.5; }
.stage .il.fillp, .stage .fillp { fill: var(--stage-panel); }
.stage .il.fillt { fill: var(--stage-teal-soft); }
.stage .win { fill: var(--stage-teal-soft); stroke: var(--stage-teal); stroke-width: 1.6; }
.stage .winoff { fill: var(--stage-bg); stroke: var(--stage-dim); stroke-width: 1.6; }
.stage .key { fill: var(--stage-line); }
.stage .dot { fill: var(--stage-teal); }
.stage .dot.e { fill: var(--stage-ember); }
.stage .badrow { fill: var(--stage-ember-soft); stroke: var(--stage-ember); stroke-width: 1.6; }
.stage .chipf, .stage .bubble { fill: var(--stage-panel); stroke: var(--stage-teal); stroke-width: 1.4; }
.stage .veil { fill: var(--stage-bg); opacity: .8; }
.stage .night { fill: var(--stage-night); opacity: .55; }
.stage .badge { fill: var(--stage-teal); }
.stage .tank path, .stage .tank ellipse { fill: var(--stage-panel); stroke: var(--stage-dim); stroke-width: 1.6; }
.stage .tank.t path, .stage .tank.t ellipse { fill: var(--stage-tank); stroke: var(--stage-teal); }
.stage .solid { fill: var(--stage-bg); }
.stage .logomark { fill: var(--stage-teal); }
.stage .logoword { fill: var(--stage-ink); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { height: 22px; width: auto; color: var(--ink); }
.stage .tagbg { fill: var(--stage-bg); stroke: var(--stage-line); stroke-width: 1.2; }
.stage .recapbg { fill: var(--stage-bg); stroke: var(--stage-teal); stroke-width: 1.6; }
.stage .rtext { font-family: var(--font-display); font-weight: 600; font-size: 23px; }
.stage .emberfill { fill: var(--stage-ember); }
.stage .emberfill2 { fill: var(--stage-ember); opacity: .55; }
.stage .tealfill2 { fill: var(--stage-teal); opacity: .55; }
.stage .tealsoft { fill: var(--stage-teal-soft); }
.stage .colhlsoft { fill: var(--stage-teal-soft); stroke: var(--stage-teal); stroke-width: 1.4; stroke-dasharray: 5 4; }
.stage .dimrow { opacity: .55; }
.stage .tagfade.on { animation: fadeout .8s ease 4s both; }
.stage .grow { transform: scaleX(0); transform-box: fill-box; transform-origin: left center; transition: transform 1.1s ease; }
.stage .on .grow { transform: none; }
.stage .on .soon { animation: fadeout .4s ease both; animation-delay: inherit; }
.stage .on .later { animation: fadein .5s ease both; }
.stage .on .fadeaway { animation: fadeaway .7s ease 1.2s both; }
@keyframes fadeout { to { opacity: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeaway { to { opacity: .12; transform: translateX(24px); } }

.stage .scan { fill: var(--stage-ember-soft); stroke: var(--stage-ember); stroke-width: 1.4; }
.stage .growy { transform: scaleY(0); transform-box: fill-box; transform-origin: center bottom; transition: transform 1.4s ease; }
.stage .on .growy { transform: none; }
.stage .travel, .stage .reject { opacity: 0; }
.stage .on .travel { animation: travel 10s linear both; }
.stage .on .reject { animation: reject 10s linear both; }
@keyframes travel { 0%, 44% { opacity: 0; transform: translate(250px, 836px); } 50% { opacity: 1; transform: translate(440px, 836px); } 64% { transform: translate(440px, 836px); }
  70% { transform: translate(640px, 836px); } 81% { transform: translate(640px, 836px); } 87% { opacity: 1; transform: translate(840px, 836px); } 93%, 100% { opacity: 0; transform: translate(900px, 836px); } }
@keyframes reject { 0%, 44% { opacity: 0; transform: translate(250px, 864px); } 50% { opacity: 1; transform: translate(440px, 864px); } 64% { transform: translate(440px, 864px); }
  71% { transform: translate(540px, 784px); } 82% { opacity: 1; transform: translate(540px, 784px); } 86%, 100% { opacity: 0; transform: translate(540px, 784px); } }
/* Presentation mode: the player fills the screen */
/* Everything shares one centered column: the width of the 16:9 frame that fits above the caption and controls */
.player.full { position: fixed; inset: 0; z-index: 100; border-radius: 0; display: flex; flex-direction: column; justify-content: center;
  --frame-w: min(calc(100vw - 48px), calc((100vh - 190px) * 16 / 9)); }
.player.full .screen { flex: 0 0 auto; width: var(--frame-w); height: calc(var(--frame-w) * 9 / 16); margin: 0 auto; aspect-ratio: auto; min-height: 0; }
.player.full .screen.is-panel { overflow-y: auto; align-items: center; }
.player.full .panel { max-width: 100%; width: 100%; margin: auto; box-sizing: border-box; padding-inline: clamp(24px, 4vw, 64px); }
.player.full .caption, .player.full .controls { width: var(--frame-w); margin: 0 auto; box-sizing: border-box; padding-inline: 0; }
.player.full .ctl { min-height: 42px; padding: 8px 14px; font-size: 15px; }
.player.full .ctl svg { width: 19px; height: 19px; }
.player.full #playBtn { width: 48px; }
.player.full .chapters { height: 26px; }
.player .panel h3:focus, .player .panel h3:focus-visible { outline: none; }
.player.full .panel h3 { font-size: clamp(22px, 2.4vw, 38px); }
.player.full .opt, .player.full .fb, .player.full .crow, .player.full .slot, .player.full .rlist li { font-size: clamp(16px, 1.3vw, 21px); }
.player.full .caption { font-size: clamp(18px, 1.6vw, 28px); text-align: center; min-height: 2.6em; }
.starts { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: max-content; max-width: 92%; }
.starts .start { position: static; transform: none; }
.start.ghost { background: transparent; color: var(--stage-ink); border: 1.5px solid var(--stage-teal); }
.stage .cam { transition: transform 1.6s cubic-bezier(.65, 0, .25, 1); }
.stage .fly { transform: translate(var(--fx), var(--fy)); }
.stage .on .fly { transform: none; transition-property: transform; transition-timing-function: cubic-bezier(.5, 0, .2, 1); transition-delay: .2s; }
.stage .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.4s ease .3s; }
.stage .on .draw { stroke-dashoffset: 0; }
.stage .il.dash.draw { stroke-dasharray: 1; }
.stage .steam { animation: steam 2.4s ease-in-out infinite; transform-box: fill-box; }
.stage .on .pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; transform-box: fill-box; transform-origin: center; }
.stage .on .fillin { animation: fillin .45s ease both; transform-box: fill-box; transform-origin: center; }
.stage .pulse, .stage .pulsehl .codehl { animation: pulse 1.6s ease-in-out infinite; }
.stage .on .fillin.pulse { animation: fillin .45s ease both, pulse 1.6s ease-in-out 1.5s infinite; }
.stage .wait { stroke-dasharray: 6 6; animation: march 1s linear infinite; }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes fillin { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes march { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) {
  .stage [data-s] { transition: none; transform: none; }
  .seg i { transition: none; }
}
@media (prefers-reduced-motion: reduce) { .stage .cam, .stage .draw, .stage .on .fly { transition: none; } .stage .steam, .stage .pulse, .stage .wait, .stage .on .pop, .stage .on .fillin { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>

="M105.524 22.7072C105.045 21.4563 103.262 20.7111 101.505 20.7111C99.5087 20.7111 97.4326 21.5628 97.4326 23.5057C97.4326 25.4486 99.5087 26.3269 101.505 26.3269C103.262 26.3269 105.045 25.5817 105.524 24.3308V22.7072ZM105.524 29.574V28.4561C104.859 29.1215 102.862 29.92 100.653 29.92C96.6341 29.92 93.3071 27.5246 93.3071 23.5057C93.3071 19.7796 96.6342 17.1713 100.973 17.1713C102.729 17.1713 104.725 17.7834 105.524 18.369V16.7721C105.524 14.7759 104.273 13.2322 101.771 13.2322C100.014 13.2322 98.8965 13.9775 98.4174 15.3614H94.1588C94.7444 12.0079 97.8319 9.47949 101.851 9.47949C106.802 9.47949 109.729 12.2209 109.729 16.6922V29.574H105.524Z" fill="currentColor"/><path d="M124.421 4.12897C118.672 4.12897 114.733 8.99955 114.733 15.9993C114.733 22.9991 118.672 27.8697 124.421 27.8697C130.17 27.8697 134.162 22.9991 134.162 15.9993C134.136 8.99955 130.197 4.12897 124.421 4.12897ZM124.421 29.9723C117.527 29.9723 112.417 24.3033 112.417 15.9993C112.417 7.6954 117.501 2.02637 124.421 2.02637C131.341 2.02637 136.451 7.66879 136.451 15.9727C136.451 24.2767 131.368 29.9723 124.421 29.9723Z" fill="currentColor"/><path d="M140.071 22.9195C141.189 26.1932 144.064 27.9232 147.764 27.9232C151.463 27.9232 154.524 25.9271 154.524 22.4671C154.524 20.0717 153.273 18.395 149.84 17.4368L144.649 15.973C140.843 14.9084 138.421 13.1784 138.421 9.34579C138.421 4.74137 142.307 2 146.992 2C152.315 2 155.482 4.7946 156.547 8.81349H154.284C153.273 5.93905 150.931 4.02276 146.992 4.02276C143.452 4.02276 140.577 5.88582 140.577 9.1861C140.577 12.0605 142.44 13.0719 145.767 14.0035L150.319 15.3342C154.79 16.5851 156.733 18.7942 156.733 22.3606C156.733 27.1514 152.847 29.9193 147.737 29.9193C142.653 29.9193 138.741 27.3909 137.703 22.8929L140.071 22.9195Z" fill="currentColor"/><path d="M159.608 6.20599H159.075V6.84476H159.581C159.821 6.84476 159.954 6.71168 159.954 6.52537C159.954 6.36568 159.821 6.23261 159.608 6.20599ZM159.075 7.19075V8.01583H158.703V5.88661H159.555C160.007 5.88661 160.3 6.12615 160.3 6.55199C160.3 6.89799 160.087 7.11091 159.794 7.19075L160.38 8.04244H159.954L159.395 7.21737H159.075V7.19075ZM159.475 5.24784C158.543 5.24784 157.771 5.96646 157.771 6.95122C157.771 7.93598 158.543 8.68121 159.475 8.68121C160.406 8.68121 161.178 7.96259 161.178 6.95122C161.152 5.96646 160.406 5.24784 159.475 5.24784ZM159.475 9.00059C158.383 9.00059 157.479 8.1489 157.479 6.97783C157.479 5.80676 158.383 4.95508 159.475 4.95508C160.566 4.95508 161.471 5.80676 161.471 6.97783C161.471 8.1489 160.566 9.00059 159.475 9.00059Z" fill="currentColor"/></svg><span class="eyebrow">Vulcan interactive lesson</span></span>

          <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp t" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp e" d="M0 0L10 5L0 10z"/></marker>

<script>
(() => {
  // ---------- SVG helpers ----------
  // Recorded narration lives at audio/<hash>.mp4 (made by make-voice.mjs)
  const hashText = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const T = (x, y, s, cls = '', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
  const G = (step, inner) => `<g data-s="${step}">${inner}</g>`;
  const arrow = (x1, y1, x2, y2, kind = '') => {
    const m = kind.includes('t') ? 'ah-t' : kind.includes('e') ? 'ah-e' : 'ah';
    return `<line class="arr ${kind}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${m})"/>`;
  };
  const cyl = (cx, cy, w, label) => {
    const rx = w / 2, h = 46, top = cy - h / 2;
    return `<g class="cyl"><path d="M${cx - rx} ${top} v${h} a${rx} 9 0 0 0 ${w} 0 v${-h}"/><ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="9"/></g>${T(cx, cy + 12, label, 'mono')}`;
  };
  const node = (x, y, w, h, title, sub = [], cls = 'box', tcls = 'ttl') => {
    const subs = [].concat(sub);
    const cx = x + w / 2, top = y + h / 2 - (subs.length * 19) / 2 + 6;
    return `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>${T(cx, top, title, tcls)}` +
      subs.map((s, i) => T(cx, top + 22 + i * 19, s, 'sm dim')).join('');
  };
  const chip = (x, y, w, s, kind) => `<rect class="chip ${kind}" x="${x}" y="${y}" width="${w}" height="26" rx="13"/>${T(x + w / 2, y + 17.5, s, 'mono ' + (kind === 'e' ? 'warn' : kind === 't' ? 'tealt' : ''))}`;
  const code = (x, y, w, lines, hl = []) =>
    `<rect class="box" x="${x}" y="${y}" width="${w}" height="${lines.length * 21 + 24}" rx="10"/>` +
    hl.map(i => `<rect class="codehl" x="${x + 8}" y="${y + 13 + i * 21}" width="${w - 16}" height="21" rx="4"/>`).join('') +
    lines.map((l, i) => `<text x="${x + 16}" y="${y + 28 + i * 21}" class="code">${esc(l)}</text>`).join('');
  // A small data table: header row + body rows, fixed column width
  const table = (x, y, cw, ch, head, rows) => {
    const w = cw * head.length, h = ch * (rows.length + 1);
    let s = `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/>`;
    for (let r = 1; r <= rows.length; r++) s += `<line class="rule" x1="${x}" y1="${y + r * ch}" x2="${x + w}" y2="${y + r * ch}"/>`;
    head.forEach((c, i) => { s += T(x + i * cw + cw / 2, y + ch / 2 + 5, c, 'mono dim'); });
    rows.forEach((row, r) => row.forEach((c, i) => { s += T(x + i * cw + cw / 2, y + (r + 1) * ch + ch / 2 + 5, c, 'mono'); }));
    return s;
  };
  const card = (x, y, w, h, title, fields) =>
    `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>` + T(x + 20, y + 30, title, 'ttl', 'start') +
    fields.map((f, i) => T(x + 20, y + 62 + i * 26, f, 'mono dim', 'start')).join('');

  // ---------- Illustration helpers ----------
  // Each scene is a world of about 1280 x 720. A camera per narration line pans and zooms over it.
  const U = (s, u, inner) => `<g data-s="${s}" data-u="${u}">${inner}</g>`;
  const P = (d, cls = 'il') => `<path class="${cls}" d="${d}"/>`;
  const R = (x, y, w, h, cls = 'il', rx = 8) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
  const draw = (d, cls = 'il t') => `<path class="${cls} draw" pathLength="1" d="${d}"/>`;
  // Dots that loop along a path forever
  const flowDots = (d, n, dur, cls = 'dot', r = 5) => Array.from({ length: n }, (_, i) =>
    `<circle class="${cls}" r="${r}"><animateMotion dur="${dur}s" repeatCount="indefinite" begin="-${(i * dur / n).toFixed(2)}s" path="${d}"/></circle>`).join('');
  // Something drawn around the origin that glides from (x0, y0) to (x1, y1) when its line is reached
  const fly = (x0, y0, x1, y1, dur, inner, delay = 0.2) =>
    `<g class="fly" style="--fx:${x0 - x1}px;--fy:${y0 - y1}px;transition-duration:${dur}s;transition-delay:${delay}s"><g transform="translate(${x1} ${y1})">${inner}</g></g>`;
  const num = (x, y, to, cls, from = 0, dec = 0, anchor = 'middle') =>
    `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}" data-count="${to}" data-from="${from}" data-dec="${dec}">${Number(from).toLocaleString('en-US', { minimumFractionDigits: dec })}</text>`;
  const pop = (delay, inner) => `<g class="pop" style="animation-delay:${delay}s">${inner}</g>`;
  // Timed swaps inside one line: "soon" fades out, "later" fades in
  const soon = (inner, d = 1.4) => `<g class="soon" style="animation-delay:${d}s">${inner}</g>`;
  const later = (inner, d = 1.6) => `<g class="later" style="animation-delay:${d}s">${inner}</g>`;
  const grow = (x, y, w, h, cls, delay = 0.3) => `<rect class="${cls} grow" style="transition-delay:${delay}s" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
  const flow = (y, w, gap, items, h = 50, x0 = 60) => items.map(([t, s, cls = 'box'], i) => {
    const x = x0 + i * (w + gap);
    const box = cls === 'tealfill'
      ? `<rect class="tealfill" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>` + T(x + w / 2, y + h / 2 + 6, t, 'ontealt')
      : node(x, y, w, h, t, s ? [s] : [], cls, s ? 'ttl' : '');
    return box + (i < items.length - 1 ? arrow(x + w + 4, y + h / 2, x + w + gap - 4, y + h / 2) : '');
  }).join('');
  const dayBoxes = (x, y, labels, fill = () => false, w = 100, step = 116, h = 84, d0 = 0.3) => labels.map((d, i) =>
    R(x + i * step, y, w, h, 'il fillp', 10) +
    (fill(i) ? `<rect class="tealfill fillin" style="animation-delay:${d0 + i * 0.2}s" x="${x + i * step + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" rx="8"/>` : '') +
    T(x + i * step + w / 2, y + h / 2 + 5, d, 'sm' + (fill(i) ? ' ontealt' : ''))).join('');

  const cup = (x, y) => `<g transform="translate(${x} ${y})">${P('M0 0 h26 l-3 22 h-20 z')}${P('M26 5 q9 2 0 11')}` +
    [5, 13, 21].map((v, i) => `<path class="il d steam" style="animation-delay:${i * .7}s" d="M${v} -5 q-4 -6 0 -12 q4 -6 0 -12"/>`).join('') + '</g>';
  const croissant = (x, y) => `<g transform="translate(${x} ${y})"><circle class="il" cx="16" cy="10" r="12"/><circle class="il" cx="16" cy="10" r="4"/>${P('M8 3 l2 2 M22 2 l-1 3 M26 12 l-3 1 M9 17 l2 -2 M19 18 l1 -2', 'il t')}</g>`;
  const cake = (x, y) => `<g transform="translate(${x} ${y})">${P('M0 22 h30 v-12 l-30 -8 z')}${P('M0 14 h30', 'il d')}<circle class="il t" cx="22" cy="0" r="3"/></g>`;
  const SHOPS = { Harbor: ['S1', cup], Market: ['S2', croissant], Station: ['S3', cake] };
  const shop = (x, y, name) => `<g transform="translate(${x} ${y})">
    ${R(0, 60, 200, 140, 'il fillp', 2)}
    <path class="il t fillt" d="M-12 60 L4 18 H196 L212 60 Z"/>
    ${[40, 80, 120, 160].map(v => `<line class="il t" x1="${v}" y1="18" x2="${v + (v - 100) * 0.16}" y2="60"/>`).join('')}
    ${P(`M-12 60 ${'q14 16 28 0 '.repeat(8)}`, 'il t')}
    ${R(20, 92, 90, 66, 'win', 4)}${(SHOPS[name] || ['', cup])[1](SHOPS[name] && name !== 'Harbor' ? 50 : 52, 128)}
    ${R(130, 104, 50, 96, 'il fillp', 3)}<circle class="dot" cx="171" cy="152" r="3"/>${SHOPS[name] ? T(155, 128, SHOPS[name][0], 'mono dim') : ''}
    ${T(100, -16, 'BEAN STREET', 'mono tealt')}${T(100, 8, name, 'ttl')}</g>`;
  const closed = (x, y) => R(x + 20, y + 92, 90, 66, 'winoff', 4) + T(x + 65, y + 130, 'CLOSED', 'mono dim');
  const register = (x, y, disp, cls = '') => `<g transform="translate(${x} ${y})">
    ${R(40, 0, 120, 44, 'il fillp', 6)}${T(100, 29, disp, 'mono ' + cls)}<line class="il" x1="100" y1="44" x2="100" y2="52"/>
    ${R(0, 52, 200, 90, 'il fillp', 8)}
    ${[0, 1, 2].map(j => [0, 1, 2, 3].map(i => R(20 + i * 28, 66 + j * 20, 18, 12, 'key', 3)).join('')).join('')}
    ${R(140, 66, 42, 52, 'il d', 4)}</g>`;
  const tank = (cx, cy, w, h, label, sub, cls = '') => {
    const rx = w / 2, top = cy - h / 2;
    return `<g class="tank ${cls}"><path d="M${cx - rx} ${top} v${h} a${rx} 14 0 0 0 ${w} 0 v${-h}"/><ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="14"/></g>` +
      T(cx, cy + 6, label, 'ttl') + T(cx, cy + 30, sub, 'sm dim');
  };
  const shield = (x, y, k) => `<path class="il ${k} fillp" d="M${x} ${y - 20} l18 6 v12 q0 16 -18 24 q-18 -8 -18 -24 v-12 z"/>` +
    (k === 't' ? P(`M${x - 7} ${y + 2} l5 5 l9 -10`, 'il t') : P(`M${x - 6} ${y - 4} l12 12 M${x + 6} ${y - 4} l-12 12`, 'il e'));
  const gate = (x, y, open) => open
    ? `<line class="il t" x1="${x}" y1="${y - 54}" x2="${x}" y2="${y - 22}"/><line class="il t" x1="${x}" y1="${y + 22}" x2="${x}" y2="${y + 54}"/>` + shield(x, y - 84, 't')
    : `<line class="il e thick" x1="${x}" y1="${y - 54}" x2="${x}" y2="${y + 54}"/>` + shield(x, y - 84, 'e');
  const screenBox = (x, y, w, h, title) => R(x, y, w, h, 'il fillp', 10) +
    `<line class="il" x1="${x + w / 2}" y1="${y + h}" x2="${x + w / 2}" y2="${y + h + 14}"/><line class="il" x1="${x + w / 2 - 30}" y1="${y + h + 14}" x2="${x + w / 2 + 30}" y2="${y + h + 14}"/>` +
    T(x + 16, y + 28, title, 'sm dim', 'start') +
    [22, 34, 28, 44, 38].map((bh, i) => `<rect class="bar" x="${x + 16 + i * 16}" y="${y + h - 16 - bh}" width="11" height="${bh}" rx="2"/>`).join('');
  const person = (x, y, name = '') => `<circle class="il fillp" cx="${x}" cy="${y - 46}" r="17"/>` + P(`M${x - 30} ${y + 8} q0 -34 30 -34 q30 0 30 34`, 'il fillp') +
    (name ? T(x, y + 32, name, 'sm') : '');
  const phone = (x, y) => R(x, y, 56, 96, 'il fillp', 10) + `<line class="il d" x1="${x + 20}" y1="${y + 86}" x2="${x + 36}" y2="${y + 86}"/>` +
    `<circle class="dot e pulse" cx="${x + 46}" cy="${y + 12}" r="6"/>`;
  const bubble = (x, y, w, lines, cls = '', d = 0.2) => pop(d, R(x, y, w, 24 + lines.length * 22, 'bubble', 12) +
    lines.map((l, i) => T(x + 16, y + 30 + i * 22, l, i === 0 ? 'sm ' + cls : 'sm dim', 'start')).join(''));
  const mcard = (x, y, name, cls = '') => R(x, y, 170, 54, 'il fillp ' + cls, 10) +
    [0, 1, 2].map(i => `<line class="il d" x1="${x + 16}" y1="${y + 18 + i * 9}" x2="${x + 34}" y2="${y + 18 + i * 9}"/>`).join('') + T(x + 100, y + 33, name, 'mono');
  const badge = (x, y, n, delay) => pop(delay, `<circle class="badge" cx="${x}" cy="${y}" r="14"/>` + T(x, y + 5, String(n), 'sm ontealt'));
  const clock = (x, y, spin = true) => `<circle class="il fillp" cx="${x}" cy="${y}" r="34"/>` + (spin
    ? `<line class="il" x1="${x}" y1="${y}" x2="${x}" y2="${y - 18}"><animateTransform attributeName="transform" type="rotate" from="0 ${x} ${y}" to="360 ${x} ${y}" dur="9s" repeatCount="indefinite"/></line>` +
      `<line class="il t" x1="${x}" y1="${y}" x2="${x + 24}" y2="${y}"><animateTransform attributeName="transform" type="rotate" from="0 ${x} ${y}" to="360 ${x} ${y}" dur="1.2s" repeatCount="indefinite"/></line>`
    : `<line class="il" x1="${x}" y1="${y}" x2="${x + 8}" y2="${y + 14}"/><line class="il t" x1="${x}" y1="${y}" x2="${x}" y2="${y + 24}"/>`);
  const veil = (x, y, w, h) => R(x, y, w, h, 'veil', 10);
  const iconCircle = (cx, cy, label, inner) => `<circle class="il t fillp" cx="${cx}" cy="${cy}" r="40"/>${inner}` + T(cx, cy + 70, label, 'sm');

  const SCORED = quizzes.map((_, i) => i).filter(i => quizzes[i].kind !== 'predict');

  const ICON_PLAY = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>';

  let voice = null;
  // Female voices, softest-sounding first, across Edge, Chrome, Safari/macOS and Windows (fallback only)
  const FEMALE = ['Ava', 'Emma', 'Jenny', 'Aria', 'Michelle', 'Sonia', 'Libby', 'Natasha', 'Allison', 'Samantha',
    'Serena', 'Susan', 'Google UK English Female', 'Google US English', 'Karen', 'Moira', 'Tessa', 'Victoria', 'Zoe', 'Zira', 'Hazel'];

  const pickVoice = () => {

    const rank = v => {

        say('Correct. ' + Q.fbOk, ++gen, null);
      } else {
        const n = wrong.filter(Boolean).length;
        feedback('no', 'Not quite.', `${n} of ${Q.items.length} are in the wrong group, marked in red. ${Q.fbNo}`, rewatchBtn(Q.scene));
        say('Not quite. ' + Q.fbNo, ++gen, null);
      }
      updateProgress();
    });
  }

  // ---------- Explain back + results ----------
  let explainDraft = '';
  function renderExplain() {
    panel.innerHTML = `<span class="tag">Explain it back</span>
      <h3 tabindex="-1">${esc(EXPLAIN.prompt)}</h3>
      <textarea id="explain-text" placeholder="${esc(EXPLAIN.placeholder)}">${esc(explainDraft)}</textarea>
      <div id="model" hidden class="model"><b>Our version:</b> ${esc(EXPLAIN.model)}</div>
      <div class="actions"><button class="btn" type="button" data-act="compare">Compare with our version</button><button class="btn ghost" type="button" data-act="next">Skip to results</button></div>`;
    $('explain-text').addEventListener('input', e => { explainDraft = e.target.value; });
    setCaption('Write it in your own words first. Then compare.');
    say(EXPLAIN.say, ++gen, null);
  }

  function renderResults() {
    const got = SCORED.filter(q => first[q] === true).length;
    const rows = SCORED.map(q => {
      const Q = quizzes[q], ok = first[q] === true, seen = q in first;
      const pill = !seen ? '<span class="pill no">Skipped</span>' : ok ? '<span class="pill ok">First try</span>' : '<span class="pill no">Needed a retry</span>';
      const again = ok ? '' : `<button class="linkbtn" type="button" data-act="rewatch" data-sc="${Q.scene}">Replay chapter</button>`;
      return `<li><span class="q">${esc(Q.short)}</span>${pill}${again}</li>`;
    }).join('');
    panel.innerHTML = `<span class="tag">Your results</span>
      <div class="score">${got} / ${SCORED.length}</div>
      <h3 tabindex="-1">${got === SCORED.length ? 'All correct on the first try.' : 'Replay the chapters you missed, then try the questions again.'}</h3>
      <ul class="rlist">${rows}</ul>
      <p>Come back in a week and take the questions again without the lesson. Recalling it later is what makes it stick.</p>
      <div class="actions"><button class="btn" type="button" data-act="quizonly">Quiz me again</button><button class="btn ghost" type="button" data-act="restart">Watch from the start</button></div>`;
    setCaption(`You got ${got} of ${SCORED.length} on the first try.`);
    say(`You got ${got} of ${SCORED.length} on the first try.`, ++gen, null);
  }

  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'next') goTo(pos + 1, true);
    else if (act === 'retry') { if (onRetry) onRetry(); }
    else if (act === 'rewatch') rewatch(+b.dataset.sc);
    else if (act === 'compare') { $('model').hidden = false; b.outerHTML = continueBtn('See results'); }
    else if (act === 'quizonly') {
      SCORED.forEach(q => { delete first[q]; delete answered[q]; });
      TL = QUIZ_ONLY; buildProgress(); goTo(0, false);
    } else if (act === 'restart') {
      Object.keys(first).forEach(k => delete first[k]);
      Object.keys(answered).forEach(k => delete answered[k]);
      TL = FULL; buildProgress(); goTo(0, true);
    }
  });

  // ---------- Controls ----------
  startBtn.addEventListener('click', () => goTo(0, true));
  // Light or dark: switches the page and the lesson screen together, and remembers the choice in this browser
  const themeBtn = $('themeBtn'), root = document.documentElement;
  const SUN = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10h2.5M16 10h2.5M4 4l1.8 1.8M14.2 14.2L16 16M4 16l1.8-1.8M14.2 5.8L16 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const MOON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  function setTheme(t) {
    root.dataset.theme = t;
    root.dataset.stage = t;
    themeBtn.innerHTML = t === 'light' ? MOON : SUN;
    themeBtn.setAttribute('aria-label', t === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
  }
  let saved = null;
  try { saved = localStorage.getItem('vulcan-theme'); } catch (e) { }
  setTheme(saved === 'light' ? 'light' : 'dark');
  themeBtn.addEventListener('click', () => {
    const t = root.dataset.stage === 'light' ? 'dark' : 'light';
    setTheme(t);
    try { localStorage.setItem('vulcan-theme', t); } catch (e) { }
  });
  // Presentation mode: native full screen where the browser allows it, a full-window player otherwise
  const player = document.querySelector('.player'), fsBtn = $('fsBtn');
  const FS_ON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3v4H3M17 7h-4V3M13 17v-4h4M3 13h4v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  const FS_OFF = fsBtn.innerHTML;
  const syncFs = () => {
    const on = player.classList.contains('full');
    fsBtn.innerHTML = on ? FS_ON : FS_OFF;
    fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
  };
  function setFull(on) {
    player.classList.toggle('full', on);
    if (on && !document.fullscreenElement && player.requestFullscreen) player.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    syncFs();
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) player.classList.remove('full'); syncFs(); });
  fsBtn.addEventListener('click', () => setFull(!player.classList.contains('full')));
  $('fsStartBtn').addEventListener('click', () => { setFull(true); goTo(0, true); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('textarea, input, select')) return;
    if (e.key === 'f' || e.key === 'F') setFull(!player.classList.contains('full'));
    else if (e.key === 'Escape' && player.classList.contains('full') && !document.fullscreenElement) setFull(false);
  });
  playBtn.addEventListener('click', togglePlay);
  voiceBtn.addEventListener('click', () => {
    muted = !muted;
    voiceBtn.setAttribute('aria-pressed', String(!muted));
    if (playing) speakLine(); else hush();
  });
  ccBtn.addEventListener('click', () => {
    const on = ccBtn.getAttribute('aria-pressed') !== 'true';
    ccBtn.setAttribute('aria-pressed', String(on));
    caption.classList.toggle('off', !on);
  });
  rateSel.addEventListener('change', () => { rate = +rateSel.value; if (playing) speakLine(); });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.target.closest('textarea, input, button, select')) return;
    e.preventDefault(); togglePlay();
  });

  showScene('title');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) stage.pauseAnimations();
  if (location.hash.startsWith('#dbg')) window.__show = (s, l) => { showScene(s); for (let i = 0; i <= l; i++) reveal(s, i); };
  buildProgress();
  updatePlayBtn();
})();
</script>
</body>
</html>
